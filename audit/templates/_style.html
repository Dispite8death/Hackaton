<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2433;--muted:#5f6b7a;--line:#e3e6eb;--accent:#1f5fbf;
--crit:#b3261e;--high:#d9480f;--med:#b07d00;--low:#5f6b7a;--good:#2b8a3e;--ok:#8a6d00;--warn:#c2410c;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1240px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:20px;margin:32px 0 12px}h3{font-size:16px;margin:20px 0 8px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:12px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi b{display:block;font-size:28px;line-height:1.1}.kpi span{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#eef1f5;font-size:13px;color:#39424f;position:sticky;top:0;cursor:pointer;user-select:none}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
.b-critical{background:var(--crit)}.b-high{background:var(--high)}.b-medium{background:var(--med)}.b-low{background:var(--low)}
.g-good{color:var(--good)}.g-ok{color:var(--ok)}.g-warn{color:var(--warn)}.g-bad{color:var(--bad)}
.score{display:flex;align-items:center;gap:8px;min-width:120px}
.bar{flex:1;height:8px;background:#e9ecf0;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%}
.bar .good{background:var(--good)}.bar .ok{background:#e0b100}.bar .warn{background:#f08c3a}.bar .bad{background:var(--bad)}
.ref{background:#e7f0ff;color:var(--accent);border-radius:6px;padding:1px 6px;font-size:12px;font-weight:600}
.muted{color:var(--muted)}.small{font-size:13px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.filters input,.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
details summary{cursor:pointer;color:var(--accent)}
ul.ev{margin:6px 0 0 0;padding-left:18px;color:#39424f;font-size:13px}
.prio li{margin:6px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.stat{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:4px 0}
.stat:last-child{border-bottom:0}
.fc-confirmed{color:var(--good)}.fc-contradiction{color:var(--crit);font-weight:600}.fc-unverified{color:var(--muted)}
.tablewrap{overflow-x:auto}
@media print{body{background:#fff;font-size:12px}.filters,.noprint{display:none}.card,.kpi,table{border-color:#bbb}
 th{position:static}a{color:#000}.wrap{padding:0}h2{page-break-after:avoid}tr{page-break-inside:avoid}}
</style>
