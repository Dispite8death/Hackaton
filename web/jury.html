<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Контур · Результаты аудита</title>
<style>
:root{font:16px/1.5 "Segoe UI",Arial,sans-serif;color:#172f39;background:#f2f6f5}*{box-sizing:border-box}body{margin:0}header{background:#133e41;color:white}header>div,main{max-width:1080px;margin:auto;padding:20px 26px}header>div{display:flex;align-items:center;gap:20px;flex-wrap:wrap}header strong{font-size:26px;letter-spacing:-1px}header a{color:#fff;margin-left:auto}a{color:#14655d}h1{font-size:clamp(30px,5vw,46px);margin:22px 0 4px;line-height:1.12}h2{font-size:21px}p{margin:5px 0 12px}.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}label{display:grid;gap:4px;font-size:14px;font-weight:600;min-width:0}select,input,button{font:inherit;border:1px solid #9faeaa;border-radius:6px;padding:8px;background:white;max-width:100%}button,summary{cursor:pointer}.row,article{background:white;border:1px solid #d4dedb;border-radius:9px;padding:12px 16px;margin:8px 0}.row{display:grid;width:100%;text-align:left;gap:3px}.row:hover,.row:focus-visible{background:#ddede8}small,.muted{color:#49606a}summary{font-weight:650}article h3{margin:0}nav{display:flex;gap:18px;flex-wrap:wrap;margin:24px 0}#back{margin-top:12px}button[aria-pressed=true]{background:#165d55;color:white}button:disabled{opacity:.55}#stats{font-weight:650}#result{overflow-wrap:anywhere}[hidden]{display:none!important}@media print{header,.toolbar,nav,#back{display:none}.row,article{break-inside:avoid}body{background:white}}
</style><header><div><strong>Контур</strong><span>Одинокие одиночки</span><a id="settings" href="/demo-settings" hidden>Настройки показа и модель</a></div></header><main>
<h1>Результаты аудита сайтов</h1><p class="muted" id="date"></p>
<div class="toolbar"><button id="archive" aria-pressed="true">Сводный аудит</button><button id="quick" aria-pressed="false">Алгоритмический аудит</button></div>
<div class="toolbar"><label>Найти учреждение<input id="q" type="search" placeholder="Название или адрес сайта"></label><label>Тип учреждения<select id="kind"><option value="">Все учреждения</option><option value="school">Школы</option><option value="kindergarten">Детские сады</option></select></label><label>Статус проверки<select id="status"></select></label><label id="det-label">Кто проверил<select id="det"><option value="">Все</option><option value="algorithm">Алгоритм</option><option value="ai">ИИ</option><option value="none">Ещё не проверено</option></select></label></div>
<p id="stats" role="status"></p><button id="back" hidden>← К списку учреждений</button><div id="result"></div>
<nav id="docs"><a href="Документация/Руководство пользователя.pdf">Руководство пользователя</a><a href="Документация/Руководство разработчика.pdf">Руководство разработчика</a><a href="Отчёты/Сводный отчёт.pdf">Готовый PDF</a></nav></main>
<script type="application/json" id="snapshot"><!--SNAPSHOT--></script><script>
const data=JSON.parse(document.querySelector("#snapshot").textContent), $=id=>document.getElementById(id);
const labels=data.labels;let mode="archive",current=null;
const el=(tag,text,cls)=>{const x=document.createElement(tag);if(text!=null)x.textContent=text;if(cls)x.className=cls;return x;};
// The separate invitation in the package opens the full portal for the scheduled show.
$("date").textContent="Снимок архива от "+new Date(data.when).toLocaleDateString("ru-RU")+". Можно искать учреждения и открывать сохранённые результаты.";
function modes(next){mode=next;current=null;const archived=mode==="archive";$("det-label").hidden=!archived;$("det").value="";$("archive").setAttribute("aria-pressed",archived);$("quick").setAttribute("aria-pressed",!archived);$("status").replaceChildren(new Option("Все результаты",""));for(const [v,n] of Object.entries(archived?labels.status:data.levels))$("status").add(new Option(n,v));draw();}
function draw(){const archived=mode==="archive",root=$("result"),term=$("q").value.trim().toLowerCase(),state=$("status").value,det=$("det").value;
root.replaceChildren();$("back").hidden=current===null;let count=0,checks=0;
const orgs=archived?data.orgs:data.quick;
for(const [index,o] of orgs.entries()){
if((current!==null && index!==current)||($("kind").value && (o.kind||o.type)!==$("kind").value)||!(o.name+" "+(o.site_url||o.url)).toLowerCase().includes(term))continue;
const rows=(archived?data.checks.filter(f=>f.organization_id===o.id):o.findings).filter(f=>(!state||(archived?f.status:f.severity)===state)&&(!det||f.detector===det));if(!rows.length&&(state||det))continue;
count++;checks+=rows.length;const sub=(archived?labels.quality[o.quality]+" · охват "+o.coverage+"%":"Балл "+o.score+" из 100")+" · результатов "+rows.length;
if(current===null){const b=el("button",null,"row");b.append(el("strong",o.name),el("small",sub));b.onclick=()=>{current=index;draw();$("back").focus();};root.append(b);continue;}
root.append(el("h2",o.name),el("p",sub,"muted"));for(const [key,title] of [["llm_summary","Сводка ИИ"],["ai_explanation","План исправления"]])if(o[key]){root.append(el("h3",title),el("p",o[key]));}
for(const f of rows){const card=el("article"),head=el("small",archived?[labels.category[f.category],labels.status[f.status],labels.detector[f.detector]].join(" · "):data.levels[f.severity]);card.append(head,el("h3",f.title||f.message));if(f.description)card.append(el("p",f.description));if(f.recommendation)card.append(el("p",f.recommendation));if(/^https?:\/\//i.test(f.url)){const link=el("a","Открыть источник");link.href=f.url;link.rel="noreferrer";link.target="_blank";card.append(link);}root.append(card);}}
$("stats").textContent="Учреждений: "+count+" · результатов: "+checks;if(!count)root.append(el("p","Совпадений нет. Измените фильтры."));}
$("back").onclick=()=>{current=null;draw();};$("archive").onclick=()=>modes("archive");$("quick").onclick=()=>modes("quick");for(const i of ["q","kind","status","det"])$(i).oninput=()=>{current=null;draw();};modes("archive");
</script></html>
