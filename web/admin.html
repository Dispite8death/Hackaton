<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Настройки · Аудит учреждений</title><link rel="stylesheet" href="/style.css">
<style>
body{margin:0;background:#f4f6f9;color:#162c43;font-family:Inter,"Segoe UI",sans-serif}
.settings-shell{max-width:1080px;margin:auto;padding:28px 24px 60px}.settings-shell a{color:#145478}.settings-shell h1{margin:24px 0 8px;font-size:34px}.settings-shell p{margin:6px 0 16px}.sections{display:grid;grid-template-columns:minmax(0,3fr) minmax(240px,2fr);gap:18px}.settings-shell section{background:white;border:1px solid #d2dce2;border-radius:12px;padding:20px 24px;margin:14px 0;min-width:0}.settings-shell h2{font-size:19px;margin:0 0 15px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.settings-shell label{display:block;font-size:14px;font-weight:600;margin-bottom:10px}.settings-shell input:not([type=checkbox]),.settings-shell select{font:inherit;width:100%;margin-top:5px;padding:8px;border:1px solid #a9bac5;border-radius:6px;background:white;box-sizing:border-box}.settings-shell button{padding:9px 12px;border:1px solid #a8bbc6;border-radius:6px;background:white;color:#18384a;margin:5px 5px 0 0;cursor:pointer;font:inherit}.settings-shell .submit{background:#135e68;color:white;border-color:#135e68}.settings-shell output{display:block;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}.settings-shell ul{padding-left:20px;max-height:180px;overflow:auto}.settings-shell li{overflow-wrap:anywhere}.settings-shell .msg{min-height:26px;color:#14596a}.settings-shell [hidden]{display:none}@media(max-width:760px){.sections{grid-template-columns:1fr}.settings-shell{padding:18px 14px}.fields{grid-template-columns:1fr}}
</style><script src="/admin.js" defer></script></head><body><main class="settings-shell">
<a href="/">← К обзору учреждений</a><h1>Настройки аудита</h1>
<p>Изменения доступны на компьютере, где запущена система.</p><output id="message" class="msg" aria-live="polite"></output>
<div class="sections"><div>
<section><h2>Обновление всех источников</h2><form id="settings"><div id="cycle-fields" class="fields"></div>
<button class="submit">Сохранить интервал и лимиты</button></form>
<button id="once">Выполнить один цикл</button><button id="sched-status">Состояние расписания</button>
<button id="sched-enable">Включить расписание на этом ПК</button><button id="sched-disable">Отключить расписание</button>
<output id="cycle-status"></output></section>
<section><h2>Хранение старых файлов</h2>
<form id="retention"><label>Хранить заменённые материалы, дней<input id="days" type="number" min="1" max="36500" required></label>
<label><input id="clean" type="checkbox"> Очищать во время автоматического цикла</label>
<button class="submit">Сохранить правило</button><button id="preview" type="button">Предпросмотр очистки</button></form>
<output id="retention-result"></output></section>
<section><h2>Независимые источники</h2><form id="fact"><label><input id="fact-auto" type="checkbox"> Проверять публикации при обновлении</label><button>Сохранить</button></form>
<ul id="sources"></ul><form id="source-form"><label>Базовый URL издателя<input id="source-url" type="url" placeholder="https://example.org/news/" required></label>
<button class="submit">Добавить источник</button></form></section>
</div><div>
<section><h2>Подключение к модели</h2><form id="model"><label>Профиль<select id="provider"></select></label>
<label>Базовый URL API<input type="url" id="endpoint" required></label><label>Модель<input id="model-id" required></label>
<label>Тайм-аут, сек.<input id="timeout" type="number" min="5" max="900" required></label>
<label>Формат ответа<select id="response"><option value="json_schema">JSON по схеме</option><option value="json_object">JSON-объект</option><option value="prompt">По инструкции</option></select></label>
<label><input id="thinking" type="checkbox"> Отключить режим рассуждений модели</label>
<label>Новый ключ API<input id="secret" type="password" autocomplete="new-password" placeholder="Оставьте пустым для сохранения текущего"></label>
<button class="submit">Сохранить и выбрать профиль</button></form></section>
<section><h2>Слова для поиска на сайтах</h2><label>Категория<select id="word-cat"></select></label>
<ul id="words"></ul><form id="word-form"><label>Слово или фраза<input id="word" required></label><button class="submit">Добавить</button></form></section>
</div></div></main></body></html>
